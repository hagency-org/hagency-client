[workspace]
members = ["crates/*"]
exclude = ["vendor/mdurl"]
default-members = ["crates/hagency-app"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
base64 = { version = "=0.22.1" }
cap-fs-ext = { version = "=4.0.3" }
cap-std = { version = "=4.0.3" }
clap = { version = "4.5.54" }
getrandom = { version = "=0.3.4" }
hagency-core = { path = "crates/hagency-core" }
hagency-execution = { path = "crates/hagency-execution" }
hagency-files = { path = "crates/hagency-files" }
hagency-history = { path = "crates/hagency-history" }
hagency-matrix = { path = "crates/hagency-matrix" }
hagency-matrix-format = { path = "crates/hagency-matrix-format" }
hagency-media = { path = "crates/hagency-media" }
hagency-media-store = { path = "crates/hagency-media-store" }
hagency-metering = { path = "crates/hagency-metering" }
hagency-palpo = { path = "crates/hagency-palpo" }
hagency-platform = { path = "crates/hagency-platform" }
hagency-progress = { path = "crates/hagency-progress" }
hagency-runtime = { path = "crates/hagency-runtime" }
hagency-store = { path = "crates/hagency-store" }
hmac = { version = "=0.12.1" }
http = { version = "=1.5.0" }
http-body-util = { version = "=0.1.5" }
hyper = { version = "=1.11.1", default-features = false }
hyper-util = { version = "=0.1.20", default-features = false }
idna = { version = "=1.1.0" }
libc = { version = "0.2.186" }
linkify = { version = "=0.10.0" }
markdown = { version = "=1.0.0" }
matrix-sdk-base = { version = "=0.19.1" }
matrix-sdk-common = { version = "=0.19.1" }
matrix-sdk-crypto = { version = "=0.19.1" }
matrix-sdk-sqlite = { version = "=0.19.1", default-features = false }
matrix-sdk-store-encryption = { version = "=0.19.1" }
mdurl = { version = "=0.3.1" }
regex = { version = "=1.13.1" }
reqwest = { version = "=0.12.28", default-features = false }
rmcp = { version = "=1.8.0", default-features = false }
ruma = { version = "=0.17.0" }
ruma-common = { version = "=0.20.0" }
# The engine stores checked unsigned counters. Declare this directly instead
# of relying on Matrix SDK feature unification when selecting individual crates.
rusqlite = { version = "=0.40.2", default-features = false, features = ["cache", "fallible_uint"] }
rustix = { version = "=1.1.4" }
ryu-js = { version = "=1.0.3" }
salvo = { version = "=1.0.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
sha2 = "0.10.9"
subtle = { version = "2.6.1" }
stats_alloc = "0.1"
dhat = "0.3"
tempfile = "3.24.0"
thiserror = "2.0.18"
time = { version = "=0.3.55", default-features = false }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-rustls = { version = "=0.26.4", default-features = false }
tokio-util = { version = "=0.7.19" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.22" }
unicode-general-category = { version = "=0.6.0" }
unicode-normalization = { version = "=0.1.25" }
windows-sys = { version = "=0.61.2" }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Keep complete executable integrity checks practical in unoptimized test builds.
[profile.dev.package."sha2@0.10.9"]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.debug-opt]
inherits = "dev"
opt-level = 3

## An optimized release profile with thin LTO.
[profile.release-lto]
inherits = "release"
lto = "thin"

## Enable full optimizations when building app bundles for distribution.
[profile.distribution]
inherits = "release"
codegen-units = 1
lto = "fat"

## For very fast compilation, not for creating an actual high-quality executable.
## This is primarily useful for CI builds.
[profile.fast]
inherits = "dev"
opt-level = 0
debug = false
lto = "off"
strip = true
debug-assertions = false
[patch.crates-io]
# Preserve mdurl percent primitives while replacing its obsolete IDNA dependency.
mdurl = { path = "vendor/mdurl" }
# Maintain the SDK changes in the fork branch; pin its reviewed revision.
matrix-sdk = { git = "https://github.com/chrislearn/matrix-rust-sdk.git", rev = "c4051424fe9ac2bea56e5e00c900d6c87294c0b7" }
matrix-sdk-base = { git = "https://github.com/chrislearn/matrix-rust-sdk.git", rev = "c4051424fe9ac2bea56e5e00c900d6c87294c0b7" }
matrix-sdk-common = { git = "https://github.com/chrislearn/matrix-rust-sdk.git", rev = "c4051424fe9ac2bea56e5e00c900d6c87294c0b7" }
matrix-sdk-crypto = { git = "https://github.com/chrislearn/matrix-rust-sdk.git", rev = "c4051424fe9ac2bea56e5e00c900d6c87294c0b7" }
matrix-sdk-indexeddb = { git = "https://github.com/chrislearn/matrix-rust-sdk.git", rev = "c4051424fe9ac2bea56e5e00c900d6c87294c0b7" }
matrix-sdk-sqlite = { git = "https://github.com/chrislearn/matrix-rust-sdk.git", rev = "c4051424fe9ac2bea56e5e00c900d6c87294c0b7" }
matrix-sdk-store-encryption = { git = "https://github.com/chrislearn/matrix-rust-sdk.git", rev = "c4051424fe9ac2bea56e5e00c900d6c87294c0b7" }
matrix-sdk-ui = { git = "https://github.com/chrislearn/matrix-rust-sdk.git", rev = "c4051424fe9ac2bea56e5e00c900d6c87294c0b7" }
# Octos' existing OpenHarmony ioctl ABI correction for rustyline's nix 0.29.
nix = { git = "https://github.com/octos-org/octos.git", rev = "deb433e9a452c03d8fe7f4f6a26b42785c47ced7" }
# Pending additive App Hub contract release; see crates/octosense-app-contract/RINX-PATCH.md.
octosense-app-contract = { path = "crates/octosense-app-contract" }
## This is required to avoid a version conflict on the libsqlite3-sys crate,
## which is a native crate that can only exist once in the dependency graph.
## The `matrix-sdk` crate's dependencies require a specific version of `libsqlite3-sys`
## (via rustsqlite which requires libsqlite3-sys 0.38),
## whereas the `tsp_sdk` crate depends on `sqlx`, which requires a different version
## of `libsqlite3-sys` (via `aries-askar`, which depends on `askar-storage`,
## which requires libsqlite3-sys 0.30.0).
## So this patch is a custom version of sqlx 0.8.6 that updates the libsqlite3-sys
## dependency to version 0.38, which is compatible with the version required by
## the matrix-sdk crate.
## See <https://github.com/launchbadge/sqlx/pull/3928/files#diff-4f4849707ed063bc5de6d9f6d105f0e7baf62d1085b3c8aee4a547468b89248fR57>
sqlx = { git = "https://github.com/project-robius/sqlx.git", branch = "update_libsqlite3-sys_version" }

## The main branch of the `tsp_sdk` repo already includes this patch, so we copy it here.
## This is required for the askar repos to work with the above-patched `sqlx` crate.
## See <https://github.com/openwallet-foundation/askar/pull/386>
askar-storage = { git = "https://github.com/openwallet-foundation/askar.git" }

[patch."https://github.com/project-robius/robius"]
# Retain the locked share implementation and check account authority at the
# actual platform presentation/payload boundary, after background preparation.
robius-share = { path = "crates/robius-share" }


