[package]
name = "hagency-execution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hagency-core.workspace = true
hagency-store.workspace = true
hagency-runtime.workspace = true
hagency-platform.workspace = true
hagency-metering.workspace = true
hagency-files.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading", "Win32_Storage_FileSystem"] }

[features]
# Read-only per-entry approval phase traces for cancellation diagnostics
# (ADR-046 stage-1). Never enabled in production builds.
test-diagnostics = ["hagency-runtime/test-diagnostics"]

[dev-dependencies]
hagency-platform = { workspace = true, features = ["test-support"] }
# Self dev-dependency lights the default-off diagnostics feature for unit and
# integration test builds only; a production build compiles none of it.
hagency-execution = { workspace = true, features = ["test-diagnostics"] }
serde.workspace = true
tempfile.workspace = true
rusqlite = { workspace = true, features = ["bundled"], default-features = true }

[[bin]]
name = "hagency-execution-probe"
path = "../hagency-runtime/src/bin/hagency-runtime-probe.rs"

[lints]
workspace = true
