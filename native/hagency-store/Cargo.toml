[package]
name = "hagency-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
shared-budget-execution = ["agent-budget", "shared-context", "shared-intake"]
agent-budget = []
shared-context = ["hagency-runtime/shared-context"]
shared-intake = []
test-support = ["hagency-platform/test-support"]
resource-adoption = ["hagency-platform/resource-adoption"]

[dependencies]
hagency-platform.workspace = true
sha2.workspace = true
hmac.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
hagency-core.workspace = true
hagency-runtime.workspace = true
palpo-hagency-contract = { git = "https://github.com/palpo-im/palpo.git", rev = "d1cea837b0e559f7a26091874ec52687d279dbe3", version = "0.4.0" }
hagency-metering.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
getrandom.workspace = true
rusqlite = { workspace = true, features = ["bundled", "trace", "fallible_uint", "hooks"] }
# Board #113: a skipped `!` line must say WHY it was skipped. The live
# regression left no trace at all, so the operator could not tell a dropped
# command from a command nobody had yet admitted.
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
hagency-agent-local = { path = "../hagency-agent-local" }
hagency-platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_IO", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
