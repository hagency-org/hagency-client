[package]
name = "hagency-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
resource-adoption = []
test-support = ["dep:tempfile"]

[dependencies]
tempfile = { workspace = true, optional = true }
cap-std.workspace = true
cap-fs-ext.workspace = true
getrandom.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["process", "event", "pipe", "net", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_SystemServices", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }
tokio = { workspace = true, features = ["io-util", "net"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
