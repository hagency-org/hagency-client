[package]
name = "hagency-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Explicit offline-fixture receipt observation; absent from normal builds.
test-fixture = []

[dependencies]
hagency-platform.workspace = true
sha2.workspace = true
hmac.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
hagency-core.workspace = true
hagency-metering.workspace = true
time.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
getrandom.workspace = true
rusqlite = { workspace = true, features = ["bundled", "trace"] }
# Board #113: a skipped `!` line must say WHY it was skipped. The live
# regression left no trace at all, so the operator could not tell a dropped
# command from a command nobody had yet admitted.
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
hagency-store = { workspace = true, features = ["test-fixture"] }
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_IO", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"
