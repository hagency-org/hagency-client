# Hagency Build CI Workflow
# This workflow builds the Hagency project across multiple platforms including desktop and mobile.
# It includes 3 main hosts: macOS, Linux, and Windows for 5 targets: MacOS, Linux, Windows, IOS, and Android.

# Build Hagency Matrix Coverage:
# ┌─────────────────┬─────────────────┬─────────────────┐
# │   Host OS       │   Target        │   Build Tool    │
# ├─────────────────┼─────────────────┼─────────────────┤
# │ Ubuntu Latest   │ Linux x86_64    │ cargo build     │
# │ macOS 15 Intel  │ macOS x86_64    │ cargo build     │
# │ macOS 15 ARM64  │ macOS ARM64     │ cargo build     │
# │ Windows 2022    │ Windows x86_64  │ cargo build     │
# │ macOS 15        │ iOS aarch64     │ cargo-makepad   │
# │ macOS 15        │ Android         │ cargo-makepad   │
# │ Ubuntu Latest   │ Android         │ cargo-makepad   │
# │ Windows 2022    │ Android         │ cargo-makepad   │
# └─────────────────┴─────────────────┴─────────────────┘

name: Hagency App Build CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  HAGENCY_NATIVE_CREDENTIAL_IO: deny
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: crates/hagency-app

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════
  # NATIVE DESKTOP BUILDS
  # These jobs build Hagency for desktop platforms using standard cargo build
  # ═══════════════════════════════════════════════════════════════════════════════════════
  build_ubuntu:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    name: Build Ubuntu (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libsqlite3-dev \
            pkg-config \
            llvm \
            clang \
            libclang-dev \
            binfmt-support \
            libxcursor-dev \
            libx11-dev \
            libasound2-dev \
            libpulse-dev \
            libwayland-dev libxkbcommon-dev libdrm-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.runner }}-build-${{ hashFiles('Cargo.lock') }}

      - name: Test native Linux library and guarded sharing
        run: |
          cargo test --locked -p robius-share --lib
          cargo test --locked -p hagency-history
          cargo test --locked -p hagency-app --lib

      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --locked -p hagency-app --profile fast

      - name: Measure real attachment heap and file custody
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          cargo build --locked --release -p hagency-app --example attachment_memory_soak --features heap-profile,agent_chat
          python3 ../../tools/test_attachment_memory_soak.py --binary "$GITHUB_WORKSPACE/target/release/examples/attachment_memory_soak" --output "$GITHUB_WORKSPACE/.run/attachment-memory"

      - name: Retain attachment memory measurements
        if: always() && matrix.runner == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: attachment-memory-linux
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
          path: |
            .run/attachment-memory/**/*.json
            .run/attachment-memory/**/*.jsonl
            .run/attachment-memory/**/*.log

  build_macos:
    timeout-minutes: 120
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Macs (M1/M2/M3/M4 chips)
          - os: macos-15
            arch: arm64
          # Intel Macs (x86_64 architecture)
          - os: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}-build-${{ hashFiles('Cargo.lock') }}

      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --locked -p hagency-app --profile fast

  build_windows:
    timeout-minutes: 120
    name: Build Windows
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Use D drive for Windows build outputs and caches
        shell: pwsh
        run: |
          $root = 'D:/BuildCache/hagency-client'
          # Some Windows 2022 D volumes carry FILE_PORTABLE_DEVICE, which the
          # credential durability adapter correctly refuses. Keep test data on
          # the system volume; large build caches can still use the D volume.
          $temporary = "$($env:SystemDrive)/hagency-ci-tmp"
          $paths = @{CARGO_HOME="$root/cargo"; CARGO_TARGET_DIR="$root/target"; TEMP=$temporary; TMP=$temporary}
          foreach ($entry in $paths.GetEnumerator()) {
            New-Item -ItemType Directory -Force -Path $entry.Value | Out-Null
            "$($entry.Key)=$($entry.Value)" >> $env:GITHUB_ENV
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-build-${{ hashFiles('Cargo.lock') }}

      - name: Test Windows update verification and file locking
        run: cargo test --locked -p hagency-updater

      - name: Verify actual credential directory durability on the test volume
        run: cargo run --locked -p hagency-store --example windows_credential_sync

      - name: Test native Windows library and guarded sharing
        run: |
          cargo test --locked -p robius-share --lib
          cargo test --locked -p hagency-history
          cargo test --locked -p hagency-app --lib

      - name: Build
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --locked -p hagency-app --profile fast

      - name: Verify signed installer handoff and restart with real NSIS
        shell: pwsh
        run: |
          $root = 'D:/BuildCache/hagency-client/updater-tools'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $archive = "$root/nsis-3.09.zip"
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.9/nsis-3.09.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'F5DC52EEF1F3884230520199BAC6F36B82D643D86B003CE51BD24B05C6BA7C91') { throw 'NSIS checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath "$root/nsis" -Force
          & (Join-Path $env:GITHUB_WORKSPACE 'tools/test-windows-updater.ps1') -NsisPath "$root/nsis/nsis-3.09/makensis.exe" -Toolchain stable

  # ═══════════════════════════════════════════════════════════════════════════════════════
  # CROSS-PLATFORM MOBILE BUILDS
  # These jobs use cargo-makepad for mobile cross-compilation
  # ═══════════════════════════════════════════════════════════════════════════════════════

  build_ios_on_macos:
    if: github.event_name == 'workflow_dispatch'
    name: Build iOS (macOS Host)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable and nightly
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install iOS toolchain
        run: |
          cargo makepad apple ios install-toolchain

      - name: Install bindgen-cli for aws-lc-sys cross-compilation
        run: |
          cargo install --force --locked bindgen-cli

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-macos-build-${{ hashFiles('Cargo.lock') }}

      - name: Build for iOS targets
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: |
          # Install iOS targets
          rustup target add aarch64-apple-ios

          # Build the iOS simulator and device targets
          # Keep the published signing/provisioning identity; Info.additions.plist
          # overrides the user-visible name to Hagency.
          cargo makepad apple ios \
          --org=org.octosense \
          --app=rinx \
          build -p hagency-app \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  build_android_on_macos:
    if: github.event_name == 'workflow_dispatch'
    name: Build Android (macOS Host)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk
          rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-macos-build-${{ hashFiles('Cargo.lock') }}

      - name: Build Android APK
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: |
          python3 tools/package-octos.py android -- \
          cargo makepad android --abi=aarch64 build -p hagency-app \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  build_android_on_linux:
    if: github.event_name == 'workflow_dispatch'
    name: Build Android (Linux Host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk
          rustup target add aarch64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-linux-build-${{ hashFiles('Cargo.lock') }}

      - name: Build Android APK
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
        run: |
          python3 tools/package-octos.py android -- \
          cargo makepad android --abi=aarch64 build -p hagency-app \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  build_android_on_windows:
    if: github.event_name == 'workflow_dispatch'
    name: Build Android (Windows Host)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: android-windows-build-${{ hashFiles('Cargo.lock') }}

      - name: Setup cargo-makepad
        uses: ./.github/actions/setup-cargo-makepad

      - name: Install Android toolchain
        run: |
          cargo makepad android install-toolchain --full-ndk
          rustup target add aarch64-linux-android

      - name: Install Ninja
        run: choco install ninja -y
        shell: powershell

      - name: Build Android APK
        env:
          RUSTFLAGS: "-D warnings"
          AWS_LC_SYS_CMAKE_BUILDER: 1
          CMAKE_GENERATOR: Ninja
        run: |
          ## Note: we can't use the profile here because cargo-makepad doesn't support custom profiles.
          # cargo makepad android build -p hagency-app --profile fast
          python3 tools/package-octos.py android -- \
          cargo makepad android --abi=aarch64 build -p hagency-app \
          --config profile.dev.opt-level=0 \
          --config profile.dev.debug=false \
          --config profile.dev.lto=\"off\" \
          --config profile.dev.strip=true \
          --config profile.dev.debug-assertions=false

  # Build Summary
  build_summary:
    name: Hagency Build Results Summary
    runs-on: ubuntu-latest
    needs: [
      build_ubuntu,
      build_macos,
      build_windows,
      build_ios_on_macos,
      build_android_on_macos,
      build_android_on_linux,
      build_android_on_windows
    ]
    if: always()

    steps:
      # This job only reads needs.* and does not check out the source tree.
      - working-directory: ${{ runner.temp }}
        run: |
          echo "=== Desktop Builds ==="
          echo "Ubuntu: ${{ needs.build_ubuntu.result }}"
          echo "macOS: ${{ needs.build_macos.result }}"
          echo "Windows: ${{ needs.build_windows.result }}"
          echo "=== iOS Builds ==="
          echo "iOS (macOS): ${{ needs.build_ios_on_macos.result }}"
          echo "=== Android Builds ==="
          echo "Android (macOS): ${{ needs.build_android_on_macos.result }}"
          echo "Android (Linux): ${{ needs.build_android_on_linux.result }}"
          echo "Android (Windows): ${{ needs.build_android_on_windows.result }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
