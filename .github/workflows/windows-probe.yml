name: Windows credential sync diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      HAGENCY_NATIVE_CREDENTIAL_IO: deny
      HAGENCY_WINDOWS_SYNC_TRACE: '1'
      RUST_BACKTRACE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-credential-sync-diagnosis
          cache-on-failure: true
      - name: Inventory actual filesystem volumes
        shell: pwsh
        run: Get-Volume | Select-Object DriveLetter,FileSystem,FileSystemType,HealthStatus,SizeRemaining,Size | Format-Table -AutoSize
      - name: Compile original directory regression targets
        run: cargo test --locked -p hagency-store --lib --no-run
      - name: Exercise original directory custody and flush on both drives
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force probe-logs | Out-Null
          $failures = 0
          foreach ($drive in @('C', 'D')) {
            $temporary = "${drive}:/hagency-credential-sync-probe"
            New-Item -ItemType Directory -Force $temporary | Out-Null
            $env:TEMP = $temporary
            $env:TMP = $temporary
            cargo test --locked -p hagency-store --lib native_windows_directory -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath "probe-logs/$drive.log"
            $code = $LASTEXITCODE
            "drive=$drive exit=$code" | Add-Content probe-logs/summary.txt
            if ($code -ne 0) { $failures++ }
            cargo run --locked -p hagency-store --example windows_credential_sync 2>&1 | Tee-Object -FilePath "probe-logs/$drive-production.log"
            $code = $LASTEXITCODE
            "drive=$drive production_exit=$code" | Add-Content probe-logs/summary.txt
            if ($code -ne 0) { $failures++ }
          }
          Get-Content probe-logs/summary.txt
          if ($failures -gt 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-diagnosis-${{ matrix.os }}
          path: probe-logs
