name: Hagency App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HAGENCY_NATIVE_CREDENTIAL_IO: deny
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

defaults:
  run:
    working-directory: crates/hagency-app

jobs:
  native:
    name: Native build and unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # Intel cold builds reached cache upload at 59m20s; include cleanup in the job budget.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          brew install cmake openssl@3
          echo "HAGENCY_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
          python3 tools/sparkle-prototype.py sdk --destination "$RUNNER_TEMP/sparkle-sdk"
          echo "HAGENCY_SPARKLE_SDK=$RUNNER_TEMP/sparkle-sdk" >> "$GITHUB_ENV"
          target=$(cargo metadata --no-deps --locked --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          mkdir -p "$target/debug/Frameworks"
          ln -sfn "$RUNNER_TEMP/sparkle-sdk/Sparkle.framework" "$target/debug/Frameworks/Sparkle.framework"
      - name: Clippy desktop, mini app core, tests and examples
        run: cargo clippy --no-deps --locked -p hagency-app -p rinx-miniapp-core --features hagency-app/agent_chat,hagency-app/octosense-module,hagency-app/macos-sparkle --all-targets -- -D warnings
      - run: cargo test --locked -p robius-share --lib
      - run: cargo test --locked --manifest-path ../miniapp-core/Cargo.toml
      - run: cargo test --locked --manifest-path ../miniapp-catalog/Cargo.toml
      - run: cargo test --locked --manifest-path ../system-apps/Cargo.toml
      - run: bash tools/package-system-apps/check.sh
      - run: python3 tools/test_package_octos.py
      - run: python3 tools/test_package_app.py
      - run: python3 tools/test_prepare_macos_sparkle.py
      - run: python3 tools/test_macos_update.py
      - run: python3 tools/test_release_assets.py
      - run: cargo test --locked -p hagency-updater
      - run: cargo clippy --locked -p hagency-updater --all-targets -- -D warnings
      - run: python3 tools/check-release-icons.py
      - run: cargo test --locked -p hagency-app --features agent_chat,octosense-module,macos-sparkle --lib
      - run: cargo build --locked -p hagency-app --features agent_chat
      - run: env -u HAGENCY_SPARKLE_SDK cargo check --locked -p hagency-app --no-default-features --features agent_chat
      - run: python3 tools/wechat-ux/check_i18n.py
      - run: python3 tools/check_theme_literals.py
      - run: python3 ../../tools/audit_app_styles.py
      - run: python3 ../../tools/check-workspace-layout.py
  article-core:
    name: Portable article core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/article-core
      - name: Clippy portable editor and theme contracts
        run: cargo clippy --no-deps --locked -p article-core -p octosense-theme-contract --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path ../article-core/Cargo.toml
      - run: cargo test --locked --manifest-path ../theme-contract/Cargo.toml
