name: Hagency Client release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the version tag and publish after all installers pass'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  HAGENCY_UPDATER_PUBLIC_KEY: ${{ vars.HAGENCY_UPDATER_PUBLIC_KEY }}
  HAGENCY_SPARKLE_PUBLIC_KEY: ${{ vars.HAGENCY_SPARKLE_PUBLIC_KEY }}

jobs:
  engine:
    name: Verify the release engine on all desktop platforms
    uses: ./.github/workflows/engine-checks.yml
  qualification:
    name: Verify real-host release qualifications
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse missing or placeholder qualification records before compiling
        run: python3 tools/native/check-release-qualifications.py
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - name: Verify source-bound real Codex sandbox observations
        run: cargo test --locked -p hagency-execution --test qualification native_codex_real_app_server
      - name: Verify real owner and two-Agent observations
        run: cargo test --locked -p hagency --test qualification native_two_agent_qualification_records_its_evidence
  package:
    needs: [engine, qualification]
    if: ${{ !cancelled() && needs.engine.result == 'success' && (needs.qualification.result == 'success' || needs.qualification.result == 'skipped') }}
    name: Installer (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: amd64
            formats: deb,appimage
          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            formats: deb,appimage
          - runner: macos-14
            platform: macos
            arch: arm64
            formats: dmg
          - runner: macos-15-intel
            platform: macos
            arch: amd64
            formats: dmg
          - runner: windows-2022
            platform: windows
            arch: amd64
            formats: nsis
    defaults:
      run:
        shell: bash
        working-directory: crates/hagency-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require update signing for published Windows installers
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.publish)
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
        run: |
          test -n "$HAGENCY_UPDATER_PUBLIC_KEY" || { echo 'Missing HAGENCY_UPDATER_PUBLIC_KEY repository variable'; exit 1; }
          test -n "$UPDATE_PRIVATE_KEY" || { echo 'Missing CARGO_PACKAGER_SIGN_PRIVATE_KEY repository secret'; exit 1; }
      - name: Prepare build directories
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path('D:/BuildCache/hagency-client') if os.name == 'nt' else Path(os.environ['RUNNER_TEMP']) / 'hagency-client'
          paths = {'CARGO_HOME': root / 'cargo', 'CARGO_TARGET_DIR': root / 'target',
                   'TEMP': root / 'tmp', 'TMP': root / 'tmp'}
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key, path in paths.items():
                  path.mkdir(parents=True, exist_ok=True)
                  print(f'{key}={path}', file=env)
          with open(os.environ['GITHUB_PATH'], 'a') as path:
              print(root / 'cargo' / 'bin', file=path)
          PY
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Check version and stamp macOS bundle
        env:
          TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 tools/check-release-icons.py
          python3 - <<'PY'
          import os, re, plistlib
          from pathlib import Path
          version = re.search(r'^version\s*=\s*"([^"]+)"', Path('Cargo.toml').read_text(), re.M)[1]
          workspace_version = re.search(r'\[workspace.package\]\s*\nversion\s*=\s*"([^"]+)"', Path('../../Cargo.toml').read_text())[1]
          assert version == workspace_version, 'Desktop and workspace versions must match'
          if os.environ['IS_TAG'] == 'true':
              assert os.environ['TAG'] == 'v' + version, 'Tag must match Client version'
          p = Path('packaging/macos/Info.plist')
          data = plistlib.loads(p.read_bytes())
          data.update(CFBundleIdentifier='org.hagency.desktop', CFBundleName='Hagency',
                      CFBundleDisplayName='Hagency', CFBundleShortVersionString=version,
                      CFBundleVersion=version.split('-', 1)[0])
          p.write_bytes(plistlib.dumps(data))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              print('STABLE_RELEASE=' + ('false' if '-' in version else 'true'), file=env)
          PY
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          metadata = json.loads(subprocess.check_output(['cargo', 'metadata', '--no-deps', '--locked', '--format-version', '1']))
          assert pathlib.Path(metadata['target_directory']).resolve() == pathlib.Path(os.environ['CARGO_TARGET_DIR']).resolve()
          PY
      - name: Require signed macOS automatic updates for stable publication
        if: runner.os == 'macOS' && env.STABLE_RELEASE == 'true' && (startsWith(github.ref, 'refs/tags/') || inputs.publish || vars.HAGENCY_SPARKLE_PUBLIC_KEY != '')
        env:
          SIGNED_RELEASE: ${{ vars.MACOS_SIGNED_RELEASE }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.HAGENCY_SPARKLE_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test "$SIGNED_RELEASE" = true || { echo 'Stable publication requires MACOS_SIGNED_RELEASE=true'; exit 1; }
          for key in HAGENCY_SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!key}" || { echo "Missing required signing configuration: $key"; exit 1; }
          done
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libsqlite3-dev pkg-config cmake clang libclang-dev \
            libxcursor-dev libx11-dev libasound2-dev libpulse-dev libwayland-dev \
            libxkbcommon-dev libdrm-dev libegl1 libva2 libva-drm2 libfuse2 patchelf
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3
          echo "HAGENCY_OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
      - name: Fetch the verified pinned Sparkle SDK
        if: runner.os == 'macOS' && env.STABLE_RELEASE == 'true' && vars.MACOS_SIGNED_RELEASE == 'true' && vars.HAGENCY_SPARKLE_PUBLIC_KEY != ''
        run: |
          python3 tools/sparkle-prototype.py sdk --destination "$RUNNER_TEMP/sparkle-sdk"
          echo "HAGENCY_SPARKLE_SDK=$RUNNER_TEMP/sparkle-sdk" >> "$GITHUB_ENV"
      - name: Windows installer tools
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - uses: Swatinem/rust-cache@v2
        with:
          key: installer-${{ matrix.platform }}-${{ matrix.arch }}
          cache-on-failure: true
      - name: Install pinned packaging tools
        run: |
          cargo install cargo-packager --version 0.10.1 --locked
          cargo install robius-packaging-commands --version 0.4.1 --locked
      - name: Test app before packaging
        run: |
          cargo test --locked -p octosense-app-contract --lib
          cargo test --locked -p hagency-app --features agent_chat --lib
      - name: Import Apple certificate for configured signed releases
        if: runner.os == 'macOS' && vars.MACOS_SIGNED_RELEASE == 'true'
        uses: ./.github/actions/import-apple-cert
        with:
          certificate: ${{ secrets.APPLE_CERTIFICATE }}
          password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Signed and notarized macOS package
        if: runner.os == 'macOS' && vars.MACOS_SIGNED_RELEASE == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$STABLE_RELEASE" == true && -n "$HAGENCY_SPARKLE_PUBLIC_KEY" ]]; then export HAGENCY_MACOS_SPARKLE=1; fi
          bash packaging/build-macos-dmg.sh
      - name: Package installers
        if: runner.os != 'macOS' || vars.MACOS_SIGNED_RELEASE != 'true'
        env:
          FORMATS: ${{ matrix.formats }}
          # linuxdeploy AppImages must run without /dev/fuse on hosted runners.
          APPIMAGE_EXTRACT_AND_RUN: 1
        # An absolute output directory avoids cargo-packager 0.10.1 resolving
        # generated scripts twice when it changes the working directory.
        run: cargo packager --verbose --release --out-dir "$PWD/dist" --formats "$FORMATS"
      - name: Collect installers and checksums
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          python3 tools/collect-release-assets.py --platform "$PLATFORM" --arch "$ARCH"
      - name: Sign Windows installer and stable update feed
        if: runner.os == 'Windows' && vars.HAGENCY_UPDATER_PUBLIC_KEY != ''
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$version" != *-* ]]; then python3 tools/sign-windows-update.py; fi
      - name: Inspect and Sparkle-sign final notarized macOS DMG
        if: runner.os == 'macOS' && env.STABLE_RELEASE == 'true' && vars.MACOS_SIGNED_RELEASE == 'true' && vars.HAGENCY_SPARKLE_PUBLIC_KEY != ''
        env:
          ARCH: ${{ matrix.arch }}
          HAGENCY_SPARKLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HAGENCY_SPARKLE_PRIVATE_KEY: ${{ secrets.HAGENCY_SPARKLE_PRIVATE_KEY }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 tools/macos-update.py sign --version "$version" --arch "$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: crates/hagency-app/release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish complete release
    needs: [engine, qualification, package]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve release tag from the built source
        id: tag
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/hagency-app/Cargo.toml", "rb"))["package"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release and write build notes
        env:
          MACOS_SIGNED: ${{ vars.MACOS_SIGNED_RELEASE }}
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          HAGENCY_SPARKLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cd release-assets
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 7
          sha256sum --check SHA256SUMS.txt
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("../crates/hagency-app/Cargo.toml", "rb"))["package"]["version"])')
          if [[ "$version" != *-* ]]; then
            test -s windows-update.json
            test -s windows-update.json.sig
            test -s hagency-windows-amd64.exe.sig
            python3 ../crates/hagency-app/tools/macos-update.py verify --root . --version "$version"
          fi
          {
            # shellcheck disable=SC2016
            printf 'Hagency Client installers built from `%s`.\n\n' "$SOURCE_SHA"
            # shellcheck disable=SC2016
            printf 'Linux: amd64/arm64 DEB and AppImage. macOS: Intel/Apple Silicon DMG. Windows: amd64 NSIS installer.\n\nVerify downloads against `SHA256SUMS.txt`.\n\n'
            if [[ "$MACOS_SIGNED" == true ]]; then
              printf 'macOS packages are Developer ID signed and notarized.\n'
            else
              printf 'macOS packages are unsigned development builds; Gatekeeper may block installation.\n'
            fi
            printf 'Windows packages are currently unsigned.\n\n'
            cat ../crates/hagency-app/packaging/release-notes.md
          } > ../release-notes.md
      - name: Upload installers and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          SOURCE_SHA: ${{ github.sha }}
          HAGENCY_SPARKLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ "$IS_TAG" != true ]]; then
            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
              jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' tag.json
            else
              gh api --method POST "repos/$GH_REPO/git/refs" \
                -f "ref=refs/tags/$TAG" -f "sha=$SOURCE_SHA"
            fi
          fi
          if gh release view "$TAG" --json isDraft > release.json 2>/dev/null; then
            jq -e '.isDraft == true' release.json
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=(--draft --verify-tag --title "Hagency Client $TAG" --notes-file release-notes.md)
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" release-assets/* "${args[@]}"
          fi
          # Read back the uploaded draft before changing its visibility/latest.
          verify_dir=$(mktemp -d)
          gh release download "$TAG" --dir "$verify_dir"
          python3 - "$verify_dir" <<'PY'
          import hashlib, pathlib, sys
          expected = pathlib.Path('release-assets')
          actual = pathlib.Path(sys.argv[1])
          assert {p.name for p in actual.iterdir()} == {p.name for p in expected.iterdir()}, 'Draft assets differ'
          def digest(path):
              value = hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''): value.update(chunk)
              return value.digest()
          for source in expected.iterdir():
              assert digest(source) == digest(actual / source.name), 'Draft upload digest mismatch: ' + source.name
          PY
          rm -rf "$verify_dir"
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false
          else
            gh release edit "$TAG" --draft=false --latest
            version="${TAG#v}"
            for _attempt in 1 2 3; do
              if python3 crates/hagency-app/tools/macos-update.py verify-remote --root release-assets --version "$version"; then exit 0; fi
              sleep 10
            done
            echo 'Public latest feed/DMG qualification failed' >&2
            exit 1
          fi
